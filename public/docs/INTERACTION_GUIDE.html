<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>成长证据驾驶舱交互说明文档</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fbfaf5;
      --card: #ffffff;
      --ink: #26312c;
      --muted: #66756e;
      --line: #e8ddc8;
      --sage: #6f8f7a;
      --soft: #f2eee4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      line-height: 1.75;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 18px 56px;
    }
    article {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      padding: 28px;
      box-shadow: 0 10px 28px rgba(38, 49, 44, 0.06);
    }
    h1, h2, h3 {
      line-height: 1.35;
      letter-spacing: 0;
    }
    h1 {
      margin: 0 0 20px;
      font-size: 28px;
    }
    h2 {
      margin: 32px 0 12px;
      border-top: 1px solid var(--line);
      padding-top: 22px;
      font-size: 22px;
    }
    h3 {
      margin: 22px 0 10px;
      font-size: 17px;
      color: var(--sage);
    }
    p { margin: 10px 0; }
    ul, ol { padding-left: 1.35rem; }
    li { margin: 4px 0; }
    code {
      border-radius: 6px;
      background: var(--soft);
      padding: 1px 5px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.92em;
    }
    pre {
      overflow: auto;
      border-radius: 8px;
      background: var(--soft);
      padding: 14px;
    }
    pre code { padding: 0; background: transparent; }
    .muted { color: var(--muted); }
    .error {
      border: 1px solid #e5b7a0;
      border-radius: 8px;
      background: #fff7f0;
      padding: 14px;
      color: #8a4a32;
    }
    @media (max-width: 720px) {
      article { padding: 20px; }
      h1 { font-size: 24px; }
      h2 { font-size: 19px; }
    }
  </style>
</head>
<body>
  <main>
    <article id="content">
      <p class="muted">正在加载完整说明文档...</p>
    </article>
  </main>
  <script>
    const content = document.getElementById('content')

    fetch('/docs/INTERACTION_GUIDE.md', { cache: 'no-cache' })
      .then((response) => {
        if (!response.ok) throw new Error('文档加载失败')
        return response.text()
      })
      .then((markdown) => {
        content.innerHTML = renderMarkdown(markdown)
      })
      .catch(() => {
        content.innerHTML = '<p class="error">完整说明文档加载失败。请在项目文件夹中打开 docs/INTERACTION_GUIDE.md 查看。</p>'
      })

    function renderMarkdown(markdown) {
      const lines = markdown.replace(/\r\n/g, '\n').split('\n')
      let html = ''
      let listType = null
      let inCode = false
      let codeLines = []

      function closeList() {
        if (!listType) return
        html += `</${listType}>`
        listType = null
      }

      for (const line of lines) {
        if (line.startsWith('```')) {
          if (inCode) {
            html += `<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`
            codeLines = []
            inCode = false
          } else {
            closeList()
            inCode = true
          }
          continue
        }

        if (inCode) {
          codeLines.push(line)
          continue
        }

        if (!line.trim()) {
          closeList()
          continue
        }

        if (line.startsWith('### ')) {
          closeList()
          html += `<h3>${inline(line.slice(4))}</h3>`
          continue
        }

        if (line.startsWith('## ')) {
          closeList()
          html += `<h2>${inline(line.slice(3))}</h2>`
          continue
        }

        if (line.startsWith('# ')) {
          closeList()
          html += `<h1>${inline(line.slice(2))}</h1>`
          continue
        }

        const ordered = line.match(/^\d+\.\s+(.+)$/)
        if (ordered) {
          if (listType !== 'ol') {
            closeList()
            html += '<ol>'
            listType = 'ol'
          }
          html += `<li>${inline(ordered[1])}</li>`
          continue
        }

        const unordered = line.match(/^-\s+(.+)$/)
        if (unordered) {
          if (listType !== 'ul') {
            closeList()
            html += '<ul>'
            listType = 'ul'
          }
          html += `<li>${inline(unordered[1])}</li>`
          continue
        }

        closeList()
        html += `<p>${inline(line)}</p>`
      }

      closeList()
      return html
    }

    function inline(value) {
      return escapeHtml(value)
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;')
    }
  </script>
</body>
</html>
